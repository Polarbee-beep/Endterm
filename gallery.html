<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gallery - BlockCrafters</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">BlockCrafters</a>
        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
                <li class="nav-item"><a class="nav-link active" href="gallery.html">Gallery</a></li>
                <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container my-5">
    <h1 class="text-center">Our Minecraft Gallery</h1>

    <div class="row mt-4 g-2">
        <div class="col-md-7">
            <input type="text" id="projectSearch"
                   class="form-control"
                   placeholder="Search projects...">
        </div>

        <div class="col-md-3">
            <select id="categoryFilter" class="form-select">
                <option value="all">All categories</option>
                <option value="fantasy">Fantasy</option>
                <option value="server">Server</option>
                <option value="modern">Modern</option>
            </select>
        </div>

        <div class="col-md-2">
            <button id="showFavorites" class="btn btn-purple w-100">
                ★ Favorites
            </button>
        </div>
    </div>

    <p id="galleryCount" class="mt-3"></p>

    <div id="galleryGrid" class="custom-grid"></div>

    <p id="emptyGallery" class="text-center d-none">
        No projects found.
    </p>
</main>

<footer>© 2026 BlockCrafters</footer>

<button id="themeToggle" class="btn btn-purple theme-toggle">🌙 Theme</button>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
