<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact - BlockCrafters</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">BlockCrafters</a>
        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
                <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
                <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container my-5" style="max-width:650px">
    <h1 class="text-center">Order a Minecraft Build</h1>
    <p class="text-center">Complete the form to request a commission.</p>

    <form id="commissionForm" class="card p-4 shadow" novalidate>

        <label for="userName">Name / Minecraft Username</label>
        <input type="text" id="userName" class="form-control mb-1">
        <small id="nameError" class="field-error"></small>

        <label for="userEmail" class="mt-3">Email Address</label>
        <input type="email" id="userEmail" class="form-control mb-1">
        <small id="emailError" class="field-error"></small>

        <label for="discordTag" class="mt-3">Discord Username</label>
        <input type="text" id="discordTag" class="form-control mb-1">
        <small id="discordError" class="field-error"></small>

        <label for="buildTier" class="mt-3">Choose Package</label>
        <select id="buildTier" class="form-select mb-1">
            <option value="">Select a package</option>
            <option value="standard">Standard Spawn</option>
            <option value="advanced">Advanced Hub</option>
            <option value="mega">Mega World Map</option>
            <option value="custom">Custom Project</option>
        </select>
        <small id="tierError" class="field-error"></small>

        <label for="projectDetails" class="mt-3">Project Details</label>
        <textarea id="projectDetails" class="form-control" rows="4"></textarea>
        <small id="detailsError" class="field-error"></small>

        <button type="submit" class="btn btn-purple mt-4">
            Submit Request
        </button>

        <div id="formSuccess" class="alert alert-success mt-3 d-none"></div>
    </form>
</main>

<footer>© 2026 BlockCrafters</footer>

<button id="themeToggle" class="btn btn-purple theme-toggle">🌙 Theme</button>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
